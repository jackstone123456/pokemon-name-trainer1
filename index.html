function parseLegend(text){const ids=[];for(const line of text.split(/\r?\n/).slice(1)){if(!line)continue;const p=line.split(','),id=+p[0];if(id>=1&&id<=1025&&(p[16]==='1'||p[17]==='1'))ids.push(id)}if(ids.length<30)throw new Error('传说/幻数据不完整');return ids}
async function fetchText(url,ms=18000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{cache:'no-cache',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(t)}}async function fetchFirst(urls){let last;for(const u of urls){try{return await fetchText(u)}catch(e){last=e}}throw last||new Error('network')}
async function initData(){let cached=null,legCached=null;try{cached=JSON.parse(localStorage.getItem(NAME_CACHE)||'null')}catch(e){}try{legCached=JSON.parse(localStorage.getItem(LEGEND_CACHE)||'null')}catch(e){}if(Array.isArray(legCached))legendIds=legCached;if(cached&&cached.length===1025){ALL=cached;$('dataBadge').textContent='名称库：1025 已缓存';build()}else{ALL=FALLBACK151;$('dataBadge').textContent='名称库：正在下载 001–1025';build()}try{const [nt,st]=await Promise.all([fetchFirst(NAME_URLS),fetchFirst(SPECIES_URLS)]),names=parseNames(nt),legends=parseLegend(st);ALL=names;legendIds=legends;localStorage.setItem(NAME_CACHE,JSON.stringify(names));localStorage.setItem(LEGEND_CACHE,JSON.stringify(legends));$('dataBadge').textContent='名称库：001–1025 已缓存';build();status('名称库已完成：001–1025 简体中文名和日文名已缓存。')}catch(e){if(ALL.length===1025){$('dataBadge').textContent='名称库：使用本机缓存';status('本次网络更新失败，但本机已有完整名称库，可正常使用。')}else{$('dataBadge').textContent='名称库：仅 001–151 备用';status('名称库下载失败，目前先使用 001–151。网络恢复后刷新页面即可自动补齐 001–1025。')}}}
function deckIds(){const d=$('deck').value;if(d==='kanto')return range(1,151);if(d==='johto')return range(152,251);if(d==='hoenn')return range(252,386);if(d==='sinnoh')return range(387,493);if(d==='unova')return range(494,649);if(d==='kalos')return range(650,721);if(d==='alola')return range(722,809);if(d==='galar')return range(810,905);if(d==='paldea')return range(906,1025);if(d==='starters')return STARTERS;if(d==='eevee')return EEVEE;if(d==='interview')return INTERVIEW300;if(d==='legendary')return legendIds;return range(1,1025)}
function build(){stop();let ids=deckIds(),avail=new Set(ALL.map(x=>x.id));ids=ids.filter(id=>avail.has(id));if($('mode').value==='unknown')ids=ids.filter(id=>unknown.has(id));q=byIds(ids);if($('order').value==='random')q=shuffle(q);pos=0;render()} function cur(){return q[pos]} function stop(){playing=false;clearTimeout(timer);speechSynthesis.cancel();autoWaitingToken=null;if($('play'))$('play').textContent='▶ 开始连续播放'}
function hideImage(msg,canRetry=false){if(currentObjectURL){URL.revokeObjectURL(currentObjectURL);currentObjectURL=null}$('pic').style.display='none';$('pic').removeAttribute('src');$('imgstate').style.display='flex';$('imgmsg').textContent=msg;$('retryImg').style.display=canRetry?'inline-block':'none'}
function imageUrls(id){return[`https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/${id}.png`,`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`,`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${id}.png`,`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`]}
async function fetchCached(url,timeout=9000){let cache=null;if('caches'in window){try{cache=await caches.open(IMG_CACHE);const hit=await cache.match(url);if(hit)return hit}catch(e){cache=null}}const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{cache:'force-cache',signal:c.signal});if(!r.ok)throw new Error();if(cache){try{await cache.put(url,r.clone())}catch(e){}}return r}finally{clearTimeout(t)}}
async function loadImage(id,token,isRetry=false){clearTimeout(imgRetryTimer);hideImage((isRetry?'正在重新连接并加载 ':'正在加载 ')+`#${String(id).padStart(3,'0')}…`);for(const url of imageUrls(id)){try{const r=await fetchCached(url);if(token!==renderToken)return false;const blob=await r.blob();if(token!==renderToken)return false;currentObjectURL=URL.createObjectURL(blob);$('pic').src=currentObjectURL;$('pic').style.display='block';$('imgstate').style.display='none';prefetchNext();onImageReady(token);return true}catch(e){}}if(token!==renderToken)return false;hideImage(navigator.onLine?'图片加载失败，网络可能不稳定。正在等待重试…':'当前网络断开，恢复后会自动重试这只。',true);imgRetryTimer=setTimeout(()=>{if(token===renderToken)loadImage(id,token,true)},7000);return false}
function onImageReady(token){if(!playing||autoWaitingToken!==token)return;autoWaitingToken=null;if($('mode').value==='quiz')timer=setTimeout(()=>next(),Math.max(1000,(+$('delay').value||3)*1000));else speak(true)}
async function prefetchId(id){if(!id)return;for(const u of imageUrls(id)){try{await fetchCached(u,5000);return}catch(e){}}} function prefetchNext(){if(!q.length)return;for(let k=1;k<=4;k++){const x=q[(pos+k)%q.length];if(x)setTimeout(()=>prefetchId(x.id),k*250)}}
function render(){clearTimeout(timer);clearTimeout(imgRetryTimer);speechSynthesis.cancel();const x=cur(),token=++renderToken;$('ucount').textContent='不会：'+unknown.size;if(!x){hideImage('当前题库没有可用题目。');$('cn').textContent='当前没有题目';$('ja').textContent='';$('dex').textContent='—';$('counter').textContent='0 / 0';$('bar').style.width='0';return}$('dex').textContent='#'+String(x.id).padStart(3,'0');$('cn').textContent=x.zh;$('ja').textContent=x.ja;$('counter').textContent=(pos+1)+' / '+q.length;$('bar').style.width=((pos+1)/q.length*100)+'%';const h=$('mode').value==='quiz';$('box').classList.toggle('hidden',h);$('reveal').style.display=h?'inline-block':'none';$('hint').textContent=h?'先自己说名字，再点“显示答案”':'图片成功后再开始自动朗读，避免图名错位';let mk=unknown.has(x.id);$('unk').textContent=mk?'★ 已加入不会':'☆ 这只不会';$('unk').className=mk?'marked':'warn';if(playing)autoWaitingToken=token;loadImage(x.id,token,false)}
function utter(text,lang){return new Promise(res=>{let a=new SpeechSynthesisUtterance(text);a.lang=lang==='zh'?'zh-CN':'ja-JP';a.rate=Math.max(.5,Math.min(1.3,+$('rate').value||.8));a.onend=res;a.onerror=res;speechSynthesis.speak(a)})}
async function speak(chain=false){const x=cur();if(!x)return;speechSynthesis.cancel();clearTimeout(timer);const my=renderToken,r=+$('repeats').value||1,lang=$('lang').value,s=[];for(let i=0;i<r;i++){if(lang==='zh'||lang==='both')s.push([x.zh,'zh']);if(lang==='ja'||lang==='both')s.push([x.ja,'ja'])}for(const [t,l] of s){if(my!==renderToken)return;await utter(t,l);await new Promise(z=>setTimeout(z,180))}if(chain&&playing&&my===renderToken)timer=setTimeout(()=>next(),Math.max(1000,(+$('delay').value||3)*1000))}
function next(){if(!q.length)return;pos=(pos+1)%q.length;render()} function prev(){if(!q.length)return;pos=(pos-1+q.length)%q.length;render()} function start(){if(!cur())return;playing=true;$('play').textContent='▶ 连续播放中';autoWaitingToken=renderToken;if($('pic').style.display!=='none')onImageReady(renderToken);else status('连续播放已启动；为了避免图名错位，会等当前图片成功加载后再朗读/切换。')}
$('prev').onclick=()=>{stop();prev()};$('next').onclick=()=>{stop();next()};$('speak').onclick=()=>speak(false);$('reveal').onclick=()=>{$('box').classList.remove('hidden');$('hint').textContent='答案已显示';speak(false)};$('unk').onclick=()=>{let x=cur();if(!x)return;unknown.has(x.id)?unknown.delete(x.id):unknown.add(x.id);localStorage.setItem(UNKNOWN_KEY,JSON.stringify([...unknown]));if($('mode').value==='unknown')build();else render()};$('play').onclick=start;$('pause').onclick=()=>{stop();status('已暂停。')};$('shuffle').onclick=()=>{stop();$('order').value='random';build()};$('retryImg').onclick=()=>{let x=cur();if(x)loadImage(x.id,renderToken,true)};$('clearCache').onclick=async()=>{if('caches'in window){try{await caches.delete(IMG_CACHE)}catch(e){}}status('图片缓存已清理；名称库和错题记录不会受影响。');render()};['deck','mode','order'].forEach(k=>$(k).addEventListener('change',build));window.addEventListener('online',()=>{let x=cur();if(x){status('网络已恢复，正在自动重试当前图片。');loadImage(x.id,renderToken,true)}});window.addEventListener('offline',()=>status('检测到网络断开。旧图片会被隐藏；恢复网络后当前图片会自动重试。'));initData();
</script>
</body></html>
